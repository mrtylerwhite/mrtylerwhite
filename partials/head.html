<style id="page-transitions">
/* Page transitions (details.so port). Inline on purpose: Chrome decides whether
   to run a cross-page transition as the new page first renders, and an opt-in
   inside an external stylesheet is sometimes not applied yet, so the transition
   was skipped at random. Text entrance (.ds-enter) lives in page-transitions.css. */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
}
::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: 0.5s;
  animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
/* Nav stays in place while the page crossfades. Named on the glass pill, and the
   group re-applies the glass blur, which a snapshot can't capture. */
#main-header .et_menu_container,
.fck-site-header .fck-nav {
  view-transition-name: site-header;
}
::view-transition-group(site-header) {
  animation-duration: 0.5s;
  animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  border-radius: 10px;
  -webkit-backdrop-filter: blur(20px) saturate(1.8);
  backdrop-filter: blur(20px) saturate(1.8);
}
</style>
